bundle:
  name: meridian_trade

workspace:
  host: https://fevm-ashwin-tvf-testing.cloud.databricks.com

variables:
  catalog:
    default: ashwin_tvf_testing_catalog
  schema:
    default: meridian_trade

resources:
  jobs:
    generate_synthetic_data:
      name: "[meridian] Generate Synthetic Data"
      tasks:
        - task_key: generate
          spark_python_task:
            python_file: ${workspace.file_path}/data_generation/generate_synthetic_data.py
            source: WORKSPACE
          environment_key: serverless_env
      environments:
        - environment_key: serverless_env
          spec:
            client: "4"

    train_propensity:
      name: "[meridian] Train Propensity Models + Score"
      tasks:
        - task_key: train
          spark_python_task:
            python_file: ${workspace.file_path}/ml/train_propensity.py
            source: WORKSPACE
          environment_key: ml_env
      environments:
        - environment_key: ml_env
          spec:
            client: "4"
            dependencies:
              - scikit-learn
              - mlflow

    sync_to_lakebase:
      name: "[meridian] Sync Recommendations to Lakebase"
      tasks:
        - task_key: sync
          spark_python_task:
            python_file: ${workspace.file_path}/lakebase/sync_to_lakebase.py
            source: WORKSPACE
          environment_key: lakebase_env
      environments:
        - environment_key: lakebase_env
          spec:
            client: "4"
            dependencies:
              - psycopg2-binary

  pipelines:
    meridian_medallion:
      name: "[meridian] Medallion Pipeline"
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      photon: true
      libraries:
        - file:
            path: pipelines/meridian_pipeline.py

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Users/${workspace.current_user.userName}/.bundle/${bundle.name}/dev
